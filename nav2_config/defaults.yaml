amcl:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    always_reset_initial_pose: false
    autostart_node: false
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    bond_heartbeat_period: 0.1
    do_beamskip: false
    first_map_only: false
    freespace_downsampling: false
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    map_topic: map
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    qos_overrides:
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
        subscription:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        subscription:
          depth: 100
          history: keep_last
          reliability: reliable
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    set_initial_pose: false
    sigma_hit: 0.2
    start_type_description_service: true
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    use_sim_time: false
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: false
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        inflation_layer_name: ''
        near_collision_cost: 253
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.4
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        trajectory_point_step: 4
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 0.5
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      batch_size: 2000
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      enforce_path_inversion: false
      gamma: 0.015
      iteration_count: 1
      max_robot_pose_search_dist: 1.5
      model_dt: 0.05
      motion_model: DiffDrive
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 1.7
      regenerate_noises: true
      retry_attempt_limit: 1
      temperature: 0.3
      time_steps: 56
      transform_tolerance: 0.1
      visualize: true
      vx_max: 0.5
      vx_min: -0.35
      vx_std: 0.2
      vy_max: 0.5
      vy_std: 0.2
      wz_max: 1.9
      wz_std: 0.4
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    controller_server:
      verbose: false
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    speed_limit_topic: speed_limit
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: false

planner_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      use_final_approach_orientation: false
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    costmap_update_timeout: 1.0
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    start_type_description_service: true
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      /bond_disable_heartbeat_timeout: true
      always_send_full_costmap: true
      autostart_node: false
      bond_heartbeat_period: 0.1
      filters: []
      footprint: '[]'
      footprint_padding: 0.009999999776482582
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflate_around_unknown: false
        inflate_unknown: false
        inflation_radius: 0.7
        plugin: nav2_costmap_2d::InflationLayer
      initial_transform_timeout: 60.0
      lethal_cost_threshold: 100
      map_topic: /map
      map_vis_z: 0.0
      observation_sources: ''
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.22
      rolling_window: true
      start_type_description_service: true
      track_unknown_space: false
      transform_tolerance: 0.3
      trinary_costmap: true
      unknown_cost_value: 255
      update_frequency: 5.0
      use_maximum: false
      use_sim_time: false
      voxel_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        mark_threshold: 0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_sources: scan
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 0.0
          inf_is_valid: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          sensor_frame: ''
          topic: /scan
        unknown_threshold: 15
        z_resolution: 0.05
        z_voxels: 16
      width: 3

global_costmap:
  global_costmap:
    ros__parameters:
      /bond_disable_heartbeat_timeout: true
      always_send_full_costmap: true
      autostart_node: false
      bond_heartbeat_period: 0.1
      filters: []
      footprint: '[]'
      footprint_padding: 0.009999999776482582
      global_frame: map
      height: 5
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflate_around_unknown: false
        inflate_unknown: false
        inflation_radius: 0.7
        plugin: nav2_costmap_2d::InflationLayer
      initial_transform_timeout: 60.0
      lethal_cost_threshold: 100
      map_topic: /map
      map_vis_z: 0.0
      observation_sources: ''
      obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 0.0
          inf_is_valid: false
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          sensor_frame: ''
          topic: /scan
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.16
      rolling_window: false
      start_type_description_service: true
      static_layer:
        enabled: true
        footprint_clearing_enabled: false
        map_subscribe_transient_local: true
        map_topic: ''
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
        transform_tolerance: 0.0
      track_unknown_space: true
      transform_tolerance: 0.3
      trinary_costmap: true
      unknown_cost_value: 255
      update_frequency: 1.0
      use_maximum: false
      use_sim_time: false
      width: 5
